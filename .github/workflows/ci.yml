name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint Python
        run: uv run --no-sync ruff check packages/core/evalgate scripts/e2e_api.py
      - name: Type-check Python
        run: uv run --no-sync mypy packages/core/evalgate
      - name: Test Python
        run: uv run --no-sync pytest -q

  studio:
    name: Studio
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.28"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Lint Studio
        run: pnpm --filter @evalgate/client lint
      - name: Install Chromium
        run: pnpm --filter @evalgate/client exec playwright install --with-deps chromium
      - name: Build production Studio and test browser flows
        run: pnpm test:e2e
      - name: Type-check Studio and browser tests
        run: pnpm --filter @evalgate/client exec tsc --noEmit
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results
          path: |
            apps/client/playwright-report/
            apps/client/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: CI
    if: ${{ always() }}
    needs: [python, studio]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          STUDIO_RESULT: ${{ needs.studio.result }}
        run: test "$PYTHON_RESULT" = success && test "$STUDIO_RESULT" = success
