[project]
name = "evalgate-workspace"
version = "0.1.0"
description = "EvalGate Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evalgate",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-jsonschema>=4.23.0.20240813",
    "types-pyyaml>=6.0.12.20240808",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-jsonschema>=4.23.0.20240813",
    "types-pyyaml>=6.0.12.20240808",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
evalgate = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
